# Name to match hwmon entry with.
name dell_smm

# Regular expression used to match files from which temperature will
# be read. Temperature is expected to be in millidegrees.
# When multiple files are matched maximum value from them will be
# used.
# Regexes are POSIX extended regular expressions matched using
# regcomp(3)/regexec(3).
sensor_regex ^temp[0-9]_input$

# Regular expression used to match files to which speed value below
# will be written to set fan speed.
pwm_regex ^pwm[0-9]+$

# Temperature thresholds: {speed, t_low, t_high}
# Fan speed is set to next threshold when temperature becomes {t_high}
# and lowered to previous threshold when temperature becomes {t_low}.
# {t_low} and {t_high} values are ignored on first and last threshold
# respectively.
# {fan_speed} is the value that will be written to files matched by
# pwm_regex above and may differ from device to device.
# Values below are for Dell XPS 15 9550 laptop and will need to be
# adjusted for your device. When in doubt start with low values and
# gradually rise them until the fans are not always on when the cpu
# is idle.
state 0   -1 65
state 128 45 75
state 255 60 128
